<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTQ Soluciones - Taller de Reparaciones</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Formulario para agregar órdenes */
    .form-container {
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.9em;
      font-weight: bold;
      margin-bottom: 5px;
      color: #495057;
    }

    .form-group input, .form-group select {
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.95em;
    }

    .btn-guardar {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-guardar:hover {
      background-color: #218838;
    }

    /* Botones de Filtro */
    .filtros-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .btn-filtro {
      padding: 8px 18px;
      border: 1px solid #007bff;
      background-color: #ffffff;
      color: #007bff;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-filtro:hover {
      background-color: #e6f0ff;
    }

    .btn-filtro.activo {
      background-color: #007bff;
      color: #ffffff;
    }

    /* Tabla de Órdenes */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f8f9fa;
      color: #495057;
    }

    /* Etiquetas de Estado */
    .badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: bold;
      display: inline-block;
    }

    .badge-proceso {
      background-color: #fff3cd;
      color: #856404;
    }

    .badge-entregado {
      background-color: #d4edda;
      color: #155724;
    }

    /* Botón de Cambiar Estado */
    .btn-cambiar {
      padding: 6px 12px;
      background-color: #17a2b8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-cambiar:hover {
      background-color: #138496;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>RTQ Soluciones - Taller de Reparaciones</h1>

    <!-- Formulario para Nueva Orden -->
    <div class="form-container">
      <h2>Registrar Nueva Orden</h2>
      <form id="form-orden" onsubmit="agregarOrden(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="cliente">Nombre del Cliente</label>
            <input type="text" id="cliente" required placeholder="Ej: Juan Pérez">
          </div>
          <div class="form-group">
            <label for="telefono">Número de Teléfono</label>
            <input type="tel" id="telefono" required placeholder="Ej: 987654321">
          </div>
          <div class="form-group">
            <label for="dni">DNI del Cliente</label>
            <input type="text" id="dni" required placeholder="Ej: 71234567">
          </div>
          <div class="form-group">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" required placeholder="Ej: Samsung A52">
          </div>
          <div class="form-group">
            <label for="equipo">Reparación / Detalles</label>
            <input type="text" id="equipo" required placeholder="Ej: Cambio de Pantalla">
          </div>
          <div class="form-group">
            <label for="estado">Estado Inicial</label>
            <select id="estado">
              <option value="en proceso">En proceso</option>
              <option value="entregado">Entregado</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-guardar">Agregar Orden</button>
      </form>
    </div>

    <!-- Barra de Filtros -->
    <div class="filtros-container">
      <button class="btn-filtro activo" onclick="filtrarEstado('todos', this)">Todos</button>
      <button class="btn-filtro" onclick="filtrarEstado('en proceso', this)">En proceso</button>
      <button class="btn-filtro" onclick="filtrarEstado('entregado', this)">Entregados</button>
    </div>

    <!-- Tabla de Registros -->
    <table>
      <thead>
        <tr>
          <th># Orden</th>
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Modelo</th>
          <th>Reparación</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-ordenes">
        <!-- Las filas se cargarán aquí dinámicamente -->
      </tbody>
    </table>
  </div>

  <script>
    let contadorOrden = 1;
    let filtroActual = 'todos';

    // Función modificada para conectar con tu API y guardar en la base de datos
    async function agregarOrden(event) {
      event.preventDefault();

      const datosOrden = {
        nombre: document.getElementById('cliente').value,
        dni: document.getElementById('dni').value,
        telefono: document.getElementById('telefono').value,
        modelo: document.getElementById('modelo').value,
        reparacion: document.getElementById('equipo').value,
        falla: document.getElementById('equipo').value,
        estado: document.getElementById('estado').value
      };

      try {
        const respuesta = await fetch('/api/ordenes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(datosOrden)
        });

        if (respuesta.ok) {
          document.getElementById('form-orden').reset();
          cargarOrdenes();
        } else {
          alert('Error al guardar la orden.');
        }
      } catch (error) {
        console.error('Error de conexión:', error);
      }
    }

    function agregarFilaOrden(orden) {
      const tabla = document.getElementById('tabla-ordenes');
      const nuevaFila = document.createElement('tr');
      nuevaFila.className = 'fila-orden';
      nuevaFila.setAttribute('data-estado', orden.estado);

      const esProceso = orden.estado === 'en proceso';
      const badgeClase = esProceso ? 'badge-proceso' : 'badge-entregado';
      const estadoTexto = esProceso ? 'En proceso' : 'Entregado';

      nuevaFila.innerHTML = `
        <td>#${orden.id}</td>
        <td>${orden.nombre}</td>
        <td>${orden.telefono}</td>
        <td>${orden.modelo}</td>
        <td>${orden.reparacion || orden.falla || ''}</td>
        <td><span class="badge ${badgeClase}">${estadoTexto}</span></td>
        <td><button class="btn-cambiar" onclick="cambiarEstado(this)">Cambiar Estado</button></td>
      `;

      tabla.appendChild(nuevaFila);
    }

    async function cargarOrdenes() {
      try {
        const respuesta = await fetch('/api/ordenes');
        if (respuesta.ok) {
          const ordenes = await respuesta.json();
          const tabla = document.getElementById('tabla-ordenes');
          tabla.innerHTML = '';

          ordenes.forEach(orden => {
            const nuevaFila = document.createElement('tr');
            nuevaFila.className = 'fila-orden';
            nuevaFila.setAttribute('data-estado', orden.estado);

            const esProceso = orden.estado === 'en proceso' || orden.estado === 'Ingresado';
            const badgeClase = esProceso ? 'badge-proceso' : 'badge-entregado';

            nuevaFila.innerHTML = `
              <td>#${String(orden.id).padStart(3, '0')}</td>
              <td>${orden.cliente}</td>
              <td>${orden.telefono}</td>
              <td>${orden.modelo}</td>
              <td>${orden.falla_reportada}</td>
              <td><span class="badge ${badgeClase}">${orden.estado}</span></td>
              <td>
                <select class="select-estado" onchange="actualizarEstadoOrden(${orden.id}, this.value)">
                  <option value="" disabled selected>Cambiar estado...</option>
                  <option value="entregado">Entregado</option>
                  <option value="en proceso">En proceso</option>
                  <option value="no quedo">No quedó</option>
                  <option value="pagado">Pagado</option>
                  <option value="no pagado">No pagado</option>
                  <option value="pendiente">Pendiente</option>
                </select>
              </td>
            `;
            tabla.appendChild(nuevaFila);
          });
        }
      } catch (error) {
        console.error('Error al cargar las órdenes:', error);
      }
    }

    async function actualizarEstadoOrden(idOrden, nuevoEstado) {
      try {
        const respuesta = await fetch(`/api/ordenes/${idOrden}/estado`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ estado: nuevoEstado })
        });

        if (respuesta.ok) {
          cargarOrdenes();
        } else {
          alert('No se pudo actualizar el estado.');
        }
      } catch (error) {
        console.error('Error al actualizar el estado:', error);
      }
    }

    function cambiarEstado(boton) {
      const fila = boton.closest('tr');
      const estadoActual = fila.getAttribute('data-estado');
      const celdaEstado = fila.children[5];

      if (estadoActual === 'en proceso') {
        fila.setAttribute('data-estado', 'entregado');
        celdaEstado.innerHTML = '<span class="badge badge-entregado">Entregado</span>';
      } else {
        fila.setAttribute('data-estado', 'en proceso');
        celdaEstado.innerHTML = '<span class="badge badge-proceso">En proceso</span>';
      }

      const botonActivo = document.querySelector('.btn-filtro.activo');
      filtrarEstado(filtroActual, botonActivo);
    }

    function filtrarEstado(estado, botonSeleccionado) {
      filtroActual = estado;

      const botones = document.querySelectorAll('.btn-filtro');
      botones.forEach(btn => btn.classList.remove('activo'));
      if (botonSeleccionado) botonSeleccionado.classList.add('activo');

      const filas = document.querySelectorAll('.fila-orden');
      filas.forEach(fila => {
        const estadoFila = fila.getAttribute('data-estado');
        fila.style.display = estado === 'todos' || estadoFila === estado ? '' : 'none';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarOrdenes();
    });
  </script>

</body>
</html>
